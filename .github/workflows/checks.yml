# The checks every pull request goes through before it can be merged.
name: Checks
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  author:
    uses: Tuatara-Editor/.github/.github/workflows/approved-author.yml@main
    permissions:
      pull-requests: write
  sign-off:
    needs: author
    uses: Tuatara-Editor/.github/.github/workflows/sign-off.yml@main
    permissions:
      pull-requests: read
