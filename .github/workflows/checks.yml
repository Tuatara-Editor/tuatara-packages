# The checks every pull request goes through before it can be merged.
name: Checks
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  author:
    uses: Tuatara-Editor/.github/.github/workflows/approved-author.yml@c6fdd3dfec1a210f38ee7283d77b2c4e7eb5f36a # main of 2026-10-21
    permissions:
      pull-requests: write
  sign-off:
    needs: author
    uses: Tuatara-Editor/.github/.github/workflows/sign-off.yml@c6fdd3dfec1a210f38ee7283d77b2c4e7eb5f36a # main of 2026-10-21
    permissions:
      pull-requests: read
